name: Android app
on:
  workflow_dispatch: {}
  push:
    paths: ['app/**', '!app/release.jks.enc', '!app/README.md', '.github/workflows/android.yml']
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Signing key (made once, kept encrypted in the repo)
        env:
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          [ -n "$PASS" ] || { echo "::error::secret BACKUP_PASSPHRASE is missing"; exit 1; }
          if [ -f app/release.jks.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in app/release.jks.enc -out "$RUNNER_TEMP/release.jks" -pass env:PASS
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storetype PKCS12 -storepass:env PASS -keypass:env PASS \
              -alias dvat -keyalg RSA -keysize 4096 -validity 36500 -dname "CN=Slovenski 2000-caki"
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$RUNNER_TEMP/release.jks" -out app/release.jks.enc -pass env:PASS
            git config user.name  "android-bot"
            git config user.email "android-bot@users.noreply.github.com"
            git add app/release.jks.enc
            git commit -m "android: signing key (encrypted) [skip ci]"
            for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep $((RANDOM % 20 + 5)); done
          fi
      - name: Android project
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          # the app tells the page its version (update check in account.js)
          node -e "const f='capacitor.config.json',c=require('./'+f);c.android.appendUserAgent=' Dvat2000App/1.0.${{ github.run_number }}';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          npx cap add android
          npx cap sync android
          A=android/app
          # version: 1.0.<run number>
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" $A/build.gradle
          grep -n "versionCode\|versionName" $A/build.gradle
          # GPS notification icon (white mountain)
          mkdir -p $A/src/main/res/drawable && cp res/ic_tracking.xml $A/src/main/res/drawable/
          sed -i 's#</resources>#  <string name="capacitor_background_geolocation_notification_icon">drawable/ic_tracking</string>\n  <string name="capacitor_background_geolocation_notification_channel_name">Spremljanje vrhov</string>\n</resources>#' $A/src/main/res/values/strings.xml
          # launcher icons from the website icons
          command -v convert >/dev/null || sudo apt-get install -y -qq imagemagick
          rm -rf $A/src/main/res/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do n=${d%%:*}; s=${d##*:}; o=$A/src/main/res/mipmap-$n; mkdir -p $o
            convert ../icon-512.png -resize ${s}x${s} $o/ic_launcher.png
            convert ../icon-maskable-512.png -resize ${s}x${s} \( -size ${s}x${s} xc:none -fill white -draw "circle $((s/2)),$((s/2)) $((s/2)),0" \) -compose DstIn -composite $o/ic_launcher_round.png
            rm -f $o/ic_launcher_foreground.png; done
          # loading screen: blue with the logo (old Androids: splash.png; Android 12+: background colour + round icon),
          # the page hides it as soon as the map is there (SplashScreen.hide, account / template), at the latest after 12 s
          for f in $(find $A/src/main/res -name splash.png); do W=$(identify -format %w $f); H=$(identify -format %h $f); S=$(( (W<H?W:H)*52/100 ))
            convert -size ${W}x${H} xc:'#0e3a86' \( ../icon-512.png -resize ${S}x${S} \) -gravity center -composite $f; done
          sed -i 's|<item name="android:background">@drawable/splash</item>|<item name="android:background">@drawable/splash</item>\n        <item name="windowSplashScreenBackground">#0e3a86</item>\n        <item name="windowSplashScreenAnimatedIcon">@mipmap/ic_launcher_round</item>\n        <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>|' $A/src/main/res/values/styles.xml
          grep -n "Splash" $A/src/main/res/values/styles.xml
          # the map also fills the strip next to the front camera (phone held sideways); the page keeps its buttons clear (safe-area insets)
          sed -i 's|<resources>|<resources xmlns:tools="http://schemas.android.com/tools">|; s|<item name="windowNoTitle">true</item>|<item name="windowNoTitle">true</item>\n        <item name="android:windowLayoutInDisplayCutoutMode" tools:targetApi="27">shortEdges</item>|' $A/src/main/res/values/styles.xml
          grep -n "Cutout" $A/src/main/res/values/styles.xml
          # ... and the same from code (some phones ignore the theme attribute): MainActivity sets the cutout mode itself
          M=$(find $A/src/main/java -name MainActivity.java | head -1); echo "$M"
          python3 - "$M" <<'PY'
          import sys, re
          p = sys.argv[1]; s = open(p).read()
          pkg = re.search(r'^package [^;]+;', s, re.M).group(0)
          open(p, 'w').write(pkg + '''
          import android.os.Build;
          import android.os.Bundle;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(Bundle b) {
              super.onCreate(b);
              if (Build.VERSION.SDK_INT >= 28) {
                WindowManager.LayoutParams lp = getWindow().getAttributes();
                lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                getWindow().setAttributes(lp);
              }
            }
          }
          ''')
          PY
          cat "$M"
      - name: Build + sign
        run: |
          cd app/android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon -q
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          U=app/build/outputs/apk/release/app-release-unsigned.apk
          $BT/zipalign -f -p 4 $U aligned.apk
          $BT/apksigner sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:PASS --key-pass env:PASS --out "$GITHUB_WORKSPACE/dvatisocaki.apk" aligned.apk
          $BT/apksigner verify --print-certs "$GITHUB_WORKSPACE/dvatisocaki.apk" | head -3
          rm -f "$RUNNER_TEMP/release.jks"
        env:
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v1.0.${{ github.run_number }}
          name: Android app 1.0.${{ github.run_number }}
          body: "Slovenski 2000-čaki za Android (APK, nameščanje mimo Google Play). Prenos: dvatisocaki.apk"
          files: dvatisocaki.apk
          make_latest: true

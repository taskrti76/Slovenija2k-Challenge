name: Daily snow data
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: snow, cancel-in-progress: true }
jobs:
  snow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow
      - run: python tools/snow_fetch.py
      - name: Commit snow.json
        run: |
          git config user.name  "snow-bot"
          git config user.email "snow-bot@users.noreply.github.com"
          git add snow.json
          git diff --cached --quiet || git commit -m "snow: $(date -u +%F)"
          git push

name: Satellite snow
on:
  schedule:
    - cron: '23 17 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: data-commit, cancel-in-progress: false }
jobs:
  snowsat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow
      - run: python tools/snowsat_fetch.py
        env:
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
      - name: Commit snowsat
        run: |
          git config user.name  "snowsat-bot"
          git config user.email "snowsat-bot@users.noreply.github.com"
          git add snowsat.png snowsat.json
          git diff --cached --quiet && exit 0
          git commit -m "snowsat: $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 10; done

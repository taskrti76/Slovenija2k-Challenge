name: Snowpack model
on:
  schedule:
    - cron: '20 2,8,14 * * *'   # night / morning (ARSO 07:00 readings) / afternoon (hourly automatic stations)
    - cron: '7 18 * * *'   # evening: + the satellite job's new snow map (17:23); each run recomputes today from the end of yesterday
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:   # own queue per job: a shared group would cancel a waiting run of another job
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  snowpack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install numpy pillow
      - run: python tools/snowpack.py
      - name: Commit snowpack
        run: |
          git config user.name  "snowpack-bot"
          git config user.email "snowpack-bot@users.noreply.github.com"
          git add snowpack.json data/snowpack_state.json
          git diff --cached --quiet && exit 0
          git commit -m "snowpack: $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep $((RANDOM % 20 + 5)); done

name: Snowpack model
on:
  schedule:
    - cron: '47 4 * * *'   # daily, after the night's model runs
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: data-commit, cancel-in-progress: false }
jobs:
  snowpack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python tools/snowpack.py
      - name: Commit snowpack
        run: |
          git config user.name  "snowpack-bot"
          git config user.email "snowpack-bot@users.noreply.github.com"
          git add snowpack.json data/snowpack_state.json
          git diff --cached --quiet && exit 0
          git commit -m "snowpack: $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 10; done

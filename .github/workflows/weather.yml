name: Daily snow data
on:
  schedule:
    - cron: '17 4 * * *'   # every day ~06:17 Slovenian time (after the 00/03 UTC ICON-D2 runs)
  workflow_dispatch: {}     # "Run workflow" button in the Actions tab
permissions:
  contents: write
concurrency: { group: data-commit, cancel-in-progress: false }
jobs:
  snow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow
      - run: python tools/snow_fetch.py
      - name: Commit snow.json
        run: |
          git config user.name  "snow-bot"
          git config user.email "snow-bot@users.noreply.github.com"
          git add snow.json
          git diff --cached --quiet && exit 0
          git commit -m "snow: $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 10; done

name: Summit weather
on:
  schedule:
    - cron: '41 1,4,7,10,13,16,19,22 * * *'   # every 3 h, ~1.5 h after each 3-hourly ICON-D2/EU run
  workflow_dispatch: {}            # "Run workflow" button in the Actions tab
permissions:
  contents: write
concurrency:   # own queue per job: a shared group would cancel a waiting run of another job
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  weather:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python tools/weather_fetch.py
      - name: Commit weather.json
        run: |
          git config user.name  "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          git add weather.json
          git diff --cached --quiet && exit 0
          git commit -m "weather: $(date -u +%F' '%H:%M)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep $((RANDOM % 20 + 5)); done

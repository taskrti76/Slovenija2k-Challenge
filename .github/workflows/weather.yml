name: Summit weather
on:
  schedule:
    - cron: '41 1,7,13,19 * * *'   # 4x a day, ~1.5 h after the 00/06/12/18 UTC ICON runs
  workflow_dispatch: {}            # "Run workflow" button in the Actions tab
permissions:
  contents: write
concurrency: { group: data-commit, cancel-in-progress: false }
jobs:
  weather:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python tools/weather_fetch.py
      - name: Commit weather.json
        run: |
          git config user.name  "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          git add weather.json
          git diff --cached --quiet && exit 0
          git commit -m "weather: $(date -u +%F' '%H:%M)"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 10; done

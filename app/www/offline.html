<!doctype html><html lang="sl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2000-čaki</title>
<body style="margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0e3a86;color:#fff;font:16px system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box">
<div><div style="font-size:56px">⛰</div><h2 style="margin:8px 0">Prvi zagon potrebuje internet</h2>
<p style="opacity:.85;max-width:300px;margin:8px auto">Aplikacija se mora enkrat naložiti s povezavo. Potem deluje tudi brez signala. Ko bo povezava, se odpre sama.</p>
<p style="opacity:.6;font-size:.9em;max-width:300px;margin:8px auto">The first start needs internet; the app opens by itself as soon as there is a connection.</p>
<div style="width:120px;height:4px;margin:18px auto 0;border-radius:2px;background:rgba(255,255,255,.22);overflow:hidden"><div id="b" style="width:40%;height:100%;background:#fff;border-radius:2px"></div></div></div>
<script>
// shown only when the site could not be loaded at all (first start without signal): hide the splash, wait for a connection, open the site
var SITE = 'https://taskrti76.github.io/Slovenija2k-Challenge/';
try{ if (window.Capacitor && Capacitor.nativePromise) Capacitor.nativePromise('SplashScreen', 'hide', {}).catch(function(){}); }catch(e){}
var x = 0; setInterval(function(){ x = (x + 4) % 140; document.getElementById('b').style.transform = 'translateX(' + (x - 40) * 2.5 + '%)'; }, 40);
function tryOpen(){ fetch(SITE + 'manifest.webmanifest', {cache: 'no-store'}).then(function(r){ if (r.ok) location.replace(SITE); }).catch(function(){}); }
addEventListener('online', tryOpen); setInterval(tryOpen, 5000); tryOpen();
</script></body></html>
